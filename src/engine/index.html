<!doctype html>
<html><head><meta charset="utf-8">
<style>
  /* Шрифты лежат в проекте, чтобы ролики выглядели одинаково на любом сервере */
  @font-face { font-family: "Inter Display"; font-weight: 700; src: url(fonts/InterDisplay-Bold.otf); }
  @font-face { font-family: "Inter Display"; font-weight: 800; src: url(fonts/InterDisplay-ExtraBold.otf); }
  @font-face { font-family: "Inter Display"; font-weight: 900; src: url(fonts/InterDisplay-Black.otf); }
  @font-face { font-family: "DejaVu Sans Mono"; font-weight: 400; src: url(fonts/DejaVuSansMono.ttf); }
  @font-face { font-family: "DejaVu Sans Mono"; font-weight: 700; src: url(fonts/DejaVuSansMono-Bold.ttf); }
  html,body{margin:0;background:#000}canvas{display:block}
</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script src="engine.js"></script><script src="templates.js"></script><script src="characters.js"></script><script src="locations.js"></script><script src="thumbs.js"></script><script src="player.js"></script>
<script>
  window.fontsReady = () => Promise.all(['700 40px "Inter Display"', '800 40px "Inter Display"', '900 40px "Inter Display"',
    '400 20px "DejaVu Sans Mono"', '700 20px "DejaVu Sans Mono"'].map(f => document.fonts.load(f)));
</script>
</body></html>
