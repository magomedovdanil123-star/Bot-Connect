openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: AI Content Factory script projects
  - name: images
    description: Generated scene images
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List saved script projects
      responses:
        "200":
          description: Saved projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Generate and save a video script
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Generated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project input
        "502":
          description: AI provider error
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a saved project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Saved project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
  /projects/{id}/regenerate:
    post:
      operationId: regenerateProject
      tags: [projects]
      summary: Regenerate a saved project script
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Regenerated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
        "502":
          description: AI provider error
  /projects/{id}/images:
    get:
      operationId: listProjectImages
      tags: [images]
      summary: List generated images for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedImage"
        "404":
          description: Project not found
    post:
      operationId: generateProjectImages
      tags: [images]
      summary: Start asynchronous image generation for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageGenerationInput"
      responses:
        "202":
          description: Image generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationJob"
        "404":
          description: Project not found
  /images/{id}:
    get:
      operationId: getImage
      tags: [images]
      summary: Get a generated image
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: Generated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedImage"
        "404":
          description: Image not found
    delete:
      operationId: deleteImage
      tags: [images]
      summary: Delete a generated image
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "204":
          description: Image deleted
        "404":
          description: Image not found
  /images/{id}/regenerate:
    post:
      operationId: regenerateImage
      tags: [images]
      summary: Regenerate an image as a new version
      parameters:
        - $ref: "#/components/parameters/ImageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageRegenerationInput"
      responses:
        "202":
          description: Image regeneration started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedImage"
        "404":
          description: Image not found
  /images/{id}/primary:
    put:
      operationId: setPrimaryImage
      tags: [images]
      summary: Select an image version as primary
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: Selected image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedImage"
        "404":
          description: Image not found
components:
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    ImageId:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Scene:
      type: object
      properties:
        scene_number:
          type: number
        duration_seconds:
          type: number
        voice_text:
          type: string
        visual_description:
          type: string
        image_prompt:
          type: string
      required:
        - scene_number
        - duration_seconds
        - voice_text
        - visual_description
        - image_prompt
    Script:
      type: object
      properties:
        title:
          type: string
        hook:
          type: string
        description:
          type: string
        duration_seconds:
          type: number
        scenes:
          type: array
          items:
            $ref: "#/components/schemas/Scene"
        ending:
          type: string
        cta:
          type: string
      required:
        - title
        - hook
        - description
        - duration_seconds
        - scenes
        - ending
        - cta
    ProjectInput:
      type: object
      properties:
        topic:
          type: string
          minLength: 3
        format:
          type: string
          enum: [Shorts, Reels, TikTok]
        duration:
          type: number
          enum: [30, 60, 90]
        style:
          type: string
          enum: [realistic, dramatic, funny, relatable, crime, motivational]
        tone:
          type: string
          enum: [serious, emotional, bold, intriguing]
      required:
        - topic
        - format
        - duration
        - style
        - tone
    Project:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        topic:
          type: string
        format:
          type: string
        duration:
          type: number
        style:
          type: string
        tone:
          type: string
        script:
          $ref: "#/components/schemas/Script"
        status:
          type: string
          enum: [draft, completed, error]
        created_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - topic
        - format
        - duration
        - style
        - tone
        - script
        - status
        - created_at
    CharacterProfileInput:
      type: object
      properties:
        gender:
          type: string
        age:
          type: string
        appearance:
          type: string
        hair:
          type: string
        clothing:
          type: string
        accessories:
          type: string
        facial_features:
          type: string
        style:
          type: string
        persistent_traits:
          type: string
      required:
        - gender
        - age
        - appearance
        - hair
        - clothing
        - accessories
        - facial_features
        - style
        - persistent_traits
    ImageGenerationInput:
      type: object
      properties:
        count:
          type: number
          minimum: 1
          maximum: 20
        aspect_ratio:
          type: string
          enum: ["9:16", "16:9", "1:1"]
        visual_style:
          type: string
        realism:
          type: string
          enum: [low, medium, high]
        people:
          type: string
          enum: [none, optional, required]
        color_atmosphere:
          type: string
        consistent_character:
          type: boolean
        character_profile:
          type: ["object", "null"]
          $ref: "#/components/schemas/CharacterProfileInput"
      required:
        - count
        - aspect_ratio
        - visual_style
        - realism
        - people
        - color_atmosphere
        - consistent_character
        - character_profile
    ImageRegenerationInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
      required:
        - prompt
    GeneratedImage:
      type: object
      properties:
        id:
          type: number
        project_id:
          type: number
        scene_id:
          type: number
        prompt:
          type: string
        negative_prompt:
          type: string
        provider:
          type: string
        model:
          type: string
        aspect_ratio:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        image_url:
          type: ["string", "null"]
        storage_path:
          type: ["string", "null"]
        width:
          type: ["number", "null"]
        height:
          type: ["number", "null"]
        generation_time:
          type: ["number", "null"]
        error:
          type: ["string", "null"]
        version:
          type: number
        is_primary:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - scene_id
        - prompt
        - negative_prompt
        - provider
        - model
        - aspect_ratio
        - status
        - image_url
        - storage_path
        - width
        - height
        - generation_time
        - error
        - version
        - is_primary
        - created_at
        - updated_at
    ImageGenerationJob:
      type: object
      properties:
        project_id:
          type: number
        status:
          type: string
          enum: [pending, processing, completed, failed]
        total:
          type: number
        image_ids:
          type: array
          items:
            type: number
      required:
        - project_id
        - status
        - total
        - image_ids

