openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: projects
    description: AI Content Factory script projects
  - name: images
    description: Generated scene images
  - name: voice
    description: ElevenLabs voice generation
  - name: sound-design
    description: Music, sound effects and audio mixing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List saved script projects
      responses:
        "200":
          description: Saved projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Generate and save a video script
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectInput"
      responses:
        "201":
          description: Generated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          description: Invalid project input
        "502":
          description: AI provider error
  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a saved project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Saved project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
  /projects/{id}/regenerate:
    post:
      operationId: regenerateProject
      tags: [projects]
      summary: Regenerate a saved project script
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Regenerated project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Project not found
        "502":
          description: AI provider error
  /projects/{id}/images:
    get:
      operationId: listProjectImages
      tags: [images]
      summary: List generated images for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedImage"
        "404":
          description: Project not found
    post:
      operationId: generateProjectImages
      tags: [images]
      summary: Start asynchronous image generation for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageGenerationInput"
      responses:
        "202":
          description: Image generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageGenerationJob"
        "404":
          description: Project not found
  /images/{id}:
    get:
      operationId: getImage
      tags: [images]
      summary: Get a generated image
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: Generated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedImage"
        "404":
          description: Image not found
    delete:
      operationId: deleteImage
      tags: [images]
      summary: Delete a generated image
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "204":
          description: Image deleted
        "404":
          description: Image not found
  /images/{id}/regenerate:
    post:
      operationId: regenerateImage
      tags: [images]
      summary: Regenerate an image as a new version
      parameters:
        - $ref: "#/components/parameters/ImageId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageRegenerationInput"
      responses:
        "202":
          description: Image regeneration started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedImage"
        "404":
          description: Image not found
  /images/{id}/primary:
    put:
      operationId: setPrimaryImage
      tags: [images]
      summary: Select an image version as primary
      parameters:
        - $ref: "#/components/parameters/ImageId"
      responses:
        "200":
          description: Selected image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedImage"
        "404":
          description: Image not found
  /voices:
    get:
      operationId: listVoices
      tags: [voice]
      summary: List cached ElevenLabs voices
      responses:
        "200":
          description: Available voices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Voice"
  /voices/refresh:
    post:
      operationId: refreshVoices
      tags: [voice]
      summary: Refresh ElevenLabs voice cache
      responses:
        "200":
          description: Refreshed voices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Voice"
  /projects/{id}/voice/generate:
    post:
      operationId: generateProjectVoice
      tags: [voice]
      summary: Start asynchronous ElevenLabs voice generation
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceGenerationInput"
      responses:
        "202":
          description: Voice generation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceGenerationJob"
        "400":
          description: ElevenLabs is not configured or input is invalid
        "404":
          description: Project not found
  /projects/{id}/voice:
    get:
      operationId: listProjectVoice
      tags: [voice]
      summary: List scene voice generations for a project
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Voice generations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VoiceGeneration"
        "404":
          description: Project not found
  /voice/{id}:
    get:
      operationId: getVoice
      tags: [voice]
      summary: Get a voice generation
      parameters:
        - $ref: "#/components/parameters/VoiceId"
      responses:
        "200":
          description: Voice generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceGeneration"
        "404":
          description: Voice generation not found
    delete:
      operationId: deleteVoice
      tags: [voice]
      summary: Delete a voice generation
      parameters:
        - $ref: "#/components/parameters/VoiceId"
      responses:
        "204":
          description: Voice generation deleted
  /voice/{id}/status:
    get:
      operationId: getVoiceStatus
      tags: [voice]
      summary: Get voice generation status
      parameters:
        - $ref: "#/components/parameters/VoiceId"
      responses:
        "200":
          description: Voice generation status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceGeneration"
  /voice/{id}/regenerate:
    post:
      operationId: regenerateVoice
      tags: [voice]
      summary: Regenerate a voice scene as a new version
      parameters:
        - $ref: "#/components/parameters/VoiceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceGenerationInput"
      responses:
        "202":
          description: Regeneration started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceGeneration"
  /voice/{id}/activate:
    post:
      operationId: activateVoice
      tags: [voice]
      summary: Activate a voice version
      parameters:
        - $ref: "#/components/parameters/VoiceId"
      responses:
        "200":
          description: Activated voice generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceGeneration"
  /music:
    get:
      operationId: listMusic
      tags: [sound-design]
      summary: Search real music assets
      parameters:
        - name: query
          in: query
          schema:
            type: string
            default: cinematic instrumental
      responses:
        "200":
          description: Music results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AudioAsset"
  /music/search:
    post:
      operationId: searchMusic
      tags: [sound-design]
      summary: Search Openverse music
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioSearchInput"
      responses:
        "200":
          description: Music results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AudioAsset"
  /music/{id}:
    get:
      operationId: getMusic
      tags: [sound-design]
      parameters:
        - $ref: "#/components/parameters/ExternalAudioId"
      responses:
        "200":
          description: Music asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioAsset"
  /music/{id}/preview:
    get:
      operationId: previewMusic
      tags: [sound-design]
      parameters:
        - $ref: "#/components/parameters/ExternalAudioId"
      responses:
        "302":
          description: Redirect to provider preview
  /projects/{id}/music/recommend:
    post:
      operationId: recommendProjectMusic
      tags: [sound-design]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "202":
          description: Auto sound design started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundJob"
  /projects/{id}/music/select:
    post:
      operationId: selectProjectMusic
      tags: [sound-design]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SelectMusicInput"
      responses:
        "201":
          description: Selected project music
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMusic"
  /projects/{id}/music:
    get:
      operationId: listProjectMusic
      tags: [sound-design]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project music
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProjectMusic"
    delete:
      operationId: deleteProjectMusic
      tags: [sound-design]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Project music deleted
  /projects/{id}/music/update:
    post:
      operationId: updateProjectMusic
      tags: [sound-design]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMusicInput"
      responses:
        "200":
          description: Updated project music
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMusic"
  /projects/{id}/music/upload:
    post:
      operationId: uploadProjectMusic
      tags: [sound-design]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: x-file-name
          in: header
          required: true
          schema:
            type: string
        - name: x-rights-confirmed
          in: header
          required: true
          schema:
            type: string
            enum: ["true"]
      requestBody:
        required: true
        content:
          audio/mpeg:
            schema:
              type: string
              format: binary
          audio/wav:
            schema:
              type: string
              format: binary
          audio/mp4:
            schema:
              type: string
              format: binary
      responses:
        "201":
          description: Uploaded project music
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMusic"
  /sound-effects:
    get:
      operationId: listSoundEffects
      tags: [sound-design]
      parameters:
        - name: query
          in: query
          schema:
            type: string
            default: sound effect
      responses:
        "200":
          description: Sound effect results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AudioAsset"
  /sound-effects/search:
    post:
      operationId: searchSoundEffects
      tags: [sound-design]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioSearchInput"
      responses:
        "200":
          description: Sound effect results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AudioAsset"
  /projects/{id}/sound-design/generate:
    post:
      operationId: generateSoundDesign
      tags: [sound-design]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "202":
          description: Sound design started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundJob"
  /projects/{id}/sound-design:
    get:
      operationId: getProjectSoundDesign
      tags: [sound-design]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Current sound design state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SoundDesignState"
    delete:
      operationId: deleteProjectSoundDesign
      tags: [sound-design]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "204":
          description: Sound design deleted
  /projects/{id}/sound-design/mix:
    post:
      operationId: mixProjectSoundDesign
      tags: [sound-design]
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "202":
          description: Audio mix started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackgroundJob"
components:
  parameters:
    ProjectId:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    ImageId:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    VoiceId:
      name: id
      in: path
      required: true
      schema:
        type: number
        minimum: 1
    ExternalAudioId:
      name: id
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Scene:
      type: object
      properties:
        scene_number:
          type: number
        duration_seconds:
          type: number
        voice_text:
          type: string
        visual_description:
          type: string
        image_prompt:
          type: string
      required:
        - scene_number
        - duration_seconds
        - voice_text
        - visual_description
        - image_prompt
    Script:
      type: object
      properties:
        title:
          type: string
        hook:
          type: string
        description:
          type: string
        duration_seconds:
          type: number
        scenes:
          type: array
          items:
            $ref: "#/components/schemas/Scene"
        ending:
          type: string
        cta:
          type: string
      required:
        - title
        - hook
        - description
        - duration_seconds
        - scenes
        - ending
        - cta
    ProjectInput:
      type: object
      properties:
        topic:
          type: string
          minLength: 3
        format:
          type: string
          enum: [Shorts, Reels, TikTok]
        duration:
          type: number
          enum: [30, 60, 90]
        style:
          type: string
          enum: [realistic, dramatic, funny, relatable, crime, motivational]
        tone:
          type: string
          enum: [serious, emotional, bold, intriguing]
      required:
        - topic
        - format
        - duration
        - style
        - tone
    Project:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        topic:
          type: string
        format:
          type: string
        duration:
          type: number
        style:
          type: string
        tone:
          type: string
        script:
          $ref: "#/components/schemas/Script"
        status:
          type: string
          enum: [draft, completed, error]
        created_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - topic
        - format
        - duration
        - style
        - tone
        - script
        - status
        - created_at
    CharacterProfileInput:
      type: object
      properties:
        gender:
          type: string
        age:
          type: string
        appearance:
          type: string
        hair:
          type: string
        clothing:
          type: string
        accessories:
          type: string
        facial_features:
          type: string
        style:
          type: string
        persistent_traits:
          type: string
      required:
        - gender
        - age
        - appearance
        - hair
        - clothing
        - accessories
        - facial_features
        - style
        - persistent_traits
    ImageGenerationInput:
      type: object
      properties:
        count:
          type: number
          minimum: 1
          maximum: 20
        aspect_ratio:
          type: string
          enum: ["9:16", "16:9", "1:1"]
        visual_style:
          type: string
        realism:
          type: string
          enum: [low, medium, high]
        people:
          type: string
          enum: [none, optional, required]
        color_atmosphere:
          type: string
        consistent_character:
          type: boolean
        character_profile:
          type: ["object", "null"]
          $ref: "#/components/schemas/CharacterProfileInput"
      required:
        - count
        - aspect_ratio
        - visual_style
        - realism
        - people
        - color_atmosphere
        - consistent_character
        - character_profile
    ImageRegenerationInput:
      type: object
      properties:
        prompt:
          type: string
          minLength: 1
      required:
        - prompt
    GeneratedImage:
      type: object
      properties:
        id:
          type: number
        project_id:
          type: number
        scene_id:
          type: number
        prompt:
          type: string
        negative_prompt:
          type: string
        provider:
          type: string
        model:
          type: string
        aspect_ratio:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        image_url:
          type: ["string", "null"]
        storage_path:
          type: ["string", "null"]
        width:
          type: ["number", "null"]
        height:
          type: ["number", "null"]
        generation_time:
          type: ["number", "null"]
        error:
          type: ["string", "null"]
        version:
          type: number
        is_primary:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - scene_id
        - prompt
        - negative_prompt
        - provider
        - model
        - aspect_ratio
        - status
        - image_url
        - storage_path
        - width
        - height
        - generation_time
        - error
        - version
        - is_primary
        - created_at
        - updated_at
    ImageGenerationJob:
      type: object
      properties:
        project_id:
          type: number
        status:
          type: string
          enum: [pending, processing, completed, failed]
        total:
          type: number
        image_ids:
          type: array
          items:
            type: number
      required:
        - project_id
        - status
        - total
        - image_ids
    Voice:
      type: object
      properties:
        voice_id:
          type: string
        name:
          type: string
        description:
          type: ["string", "null"]
        gender:
          type: ["string", "null"]
        language:
          type: ["string", "null"]
        accent:
          type: ["string", "null"]
        preview_url:
          type: ["string", "null"]
      required:
        - voice_id
        - name
        - description
        - gender
        - language
        - accent
        - preview_url
    VoiceGenerationInput:
      type: object
      properties:
        voice_id:
          type: string
          minLength: 1
        voice_name:
          type: ["string", "null"]
        model_id:
          type: string
          minLength: 1
        speed:
          type: number
          minimum: 0.8
          maximum: 1.2
        stability:
          type: number
          minimum: 0
          maximum: 1
        similarity:
          type: number
          minimum: 0
          maximum: 1
        style:
          type: number
          minimum: 0
          maximum: 1
        speaker_boost:
          type: boolean
        tone:
          type: string
          enum: [natural, storytelling, cinematic, dramatic, advertising, news, calm, energetic]
      required:
        - voice_id
        - voice_name
        - model_id
        - speed
        - stability
        - similarity
        - style
        - speaker_boost
        - tone
    VoiceGeneration:
      type: object
      properties:
        id:
          type: number
        project_id:
          type: number
        scene_id:
          type: number
        provider:
          type: string
        voice_id:
          type: string
        voice_name:
          type: ["string", "null"]
        model_id:
          type: string
        text:
          type: string
        settings:
          $ref: "#/components/schemas/VoiceSettings"
        status:
          type: string
          enum: [pending, processing, completed, failed]
        audio_url:
          type: ["string", "null"]
        storage_path:
          type: ["string", "null"]
        duration:
          type: ["number", "null"]
        file_size:
          type: ["number", "null"]
        error:
          type: ["string", "null"]
        version:
          type: number
        is_active:
          type: boolean
        start_time:
          type: ["number", "null"]
        end_time:
          type: ["number", "null"]
        is_full_voice:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
        - id
        - project_id
        - scene_id
        - provider
        - voice_id
        - voice_name
        - model_id
        - text
        - settings
        - status
        - audio_url
        - storage_path
        - duration
        - file_size
        - error
        - version
        - is_active
        - start_time
        - end_time
        - is_full_voice
        - created_at
        - updated_at
    VoiceGenerationJob:
      type: object
      properties:
        project_id:
          type: number
        status:
          type: string
          enum: [pending, processing, completed, failed]
        total:
          type: number
        voice_ids:
          type: array
          items:
            type: number
      required:
        - project_id
        - status
        - total
        - voice_ids
    VoiceSettings:
      type: object
      properties:
        speed:
          type: number
        stability:
          type: number
        similarity:
          type: number
        style:
          type: number
        speaker_boost:
          type: boolean
        tone:
          type: string
      required:
        - speed
        - stability
        - similarity
        - style
        - speaker_boost
        - tone
    AudioSearchInput:
      type: object
      properties:
        query:
          type: string
          minLength: 1
        category:
          type: string
        mood:
          type: string
        limit:
          type: number
          minimum: 1
          maximum: 20
          default: 8
      required:
        - query
    AudioAsset:
      type: object
      properties:
        provider:
          type: string
        external_id:
          type: string
        title:
          type: string
        creator:
          type: ["string", "null"]
        source_url:
          type: string
        preview_url:
          type: ["string", "null"]
        download_url:
          type: string
        license:
          type: string
        license_url:
          type: ["string", "null"]
        requires_attribution:
          type: boolean
        duration:
          type: ["number", "null"]
        category:
          type: string
        metadata:
          type: object
          additionalProperties: true
      required:
