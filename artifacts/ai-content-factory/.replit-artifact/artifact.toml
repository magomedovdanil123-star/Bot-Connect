kind = "web"
previewPath = "/"
title = "AI Content Factory"
description = "A web interface for creating and saving structured short-form video scripts from a topic using OpenRouter AI, with Telegram bot support through the shared API server."
version = "1.0.0"
id = "artifacts/ai-content-factory"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24034

[services.development]
run = "pnpm --filter @workspace/ai-content-factory run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-content-factory", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-content-factory/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24034"
BASE_PATH = "/"
