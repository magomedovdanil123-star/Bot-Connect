kind = "video"
videoAspectRatio = "9:16"
previewPath = "/hbar-technical-setup-demo/"
title = "HBAR — «24 часа» + сетап"
description = "A standalone vertical demo continuing the HBAR 24-hour result into a historical 4-hour technical setup. Uses Binance Spot market data, a hypothetical trade, and does not alter the production Telegram format."
version = "1.0.0"
id = "artifacts/hbar-technical-setup-demo"
router = "path"

[[services]]
name = "web"
paths = [ "/hbar-technical-setup-demo/" ]
localPort = 18434

[services.development]
run = "pnpm --filter @workspace/hbar-technical-setup-demo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hbar-technical-setup-demo", "run", "build" ]
serve = "static"
publicDir = "artifacts/hbar-technical-setup-demo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18434"
BASE_PATH = "/hbar-technical-setup-demo/"
