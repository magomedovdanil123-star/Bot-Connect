kind = "video"
previewPath = "/hbar-technical-setup-demo/"
title = "HBAR — Technical Setup Demo"
description = "A standalone educational sample video showing a hypothetical HBAR technical setup, animated candlesticks, entry and exit levels, and a profit highlight. Market values are simulated for demonstration."
version = "1.0.0"
id = "artifacts/hbar-technical-setup-demo"
router = "path"

[[services]]
name = "web"
paths = [ "/hbar-technical-setup-demo/" ]
localPort = 18434

[services.development]
run = "pnpm --filter @workspace/hbar-technical-setup-demo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/hbar-technical-setup-demo", "run", "build" ]
serve = "static"
publicDir = "artifacts/hbar-technical-setup-demo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18434"
BASE_PATH = "/hbar-technical-setup-demo/"
